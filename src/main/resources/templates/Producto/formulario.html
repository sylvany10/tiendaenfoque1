<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Formulario</title>
</head>
<body>
<!--NAV-->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <!-- Logo como imagen a la izquierda -->
        <a class="navbar-brand" href="#">
            <img th:src="@{/imagenes/logoec.png}" alt="Enfoque" width="220" height="auto" class="d-inline-block align-text-top">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/formulario}">Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/clientes/formularioCliente}">Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/servicio/nuevo}">Servicios</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
    <h2>Registro de Producto</h2>
    <!--FORMULARIO-->
    <form th:action="@{/guardar}" method="post" th:object="${producto}">
        <div class="mb-3">
            <label for="id-codigo" class="form-label">Códido</label>
            <input type="number" class="form-control" id="id-codigo" th:field="*{id}">
        </div>
        <div class="mb-3">
            <label for="id-nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="id-nombre" th:field="*{nombre}">
        </div>
        <div class="mb-3">
            <label for="id-precio" class="form-label">Precio</label>
            <input type="text" class="form-control" id="id-precio" th:field="*{precio}">
        </div>
        <div class="mb-3">
            <label for="id-stock" class="form-label">Stock</label>
            <input type="number" class="form-control" id="id-stock" th:field="*{stock}">
        </div>
        <button type="submit" class="btn btn-guardar">Guardar</button>
    </form>
</body>
</html>
