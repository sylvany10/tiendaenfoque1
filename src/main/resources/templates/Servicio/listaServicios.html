<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Servicios</title>
</head>
<body>
<!--NAV-->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <!-- Logo como imagen a la izquierda -->
        <a class="navbar-brand" href="#">
            <img th:src="@{/imagenes/logoec.png}" alt="Enfoque" width="220" height="auto" class="d-inline-block align-text-top">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/formulario}">Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/clientes/formularioCliente}">Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/servicio/nuevo}">Servicios</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<h2>Lista de Servicios</h2>
<div class="container mt-4">
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Cliente</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
            <tbody>
                <tr th:each="servicio: ${servicios}">
                    <td th:text="${servicio.id}"></td>
                    <td th:text="${servicio.cliente?.nombreCliente + ' ' + servicio.cliente?.apellidoCliente}"></td>
                    <td th:text="${servicio.descripcion}"></td>
                    <td th:text="${servicio.precio}"></td>
                    <td>
                        <a th:href="@{/servicio/editar/{idServicio}(idServicio=${servicio.id})}"class="btn btn-warning btn-sm">Actualizar</a>
                        <a th:href="@{/servicio/eliminar/{idServicio}(idServicio=${servicio.id})}"class="btn btn-warning btn-sm">Eliminar</a>
                    </td>
                </tr>

            </tbody>
    </table>
    <a th:href="@{/servicio/nuevo}" class="btn btn-primary text-white btn-sm">Nuevo Servicio</a>
</div>
</body>
</html>
