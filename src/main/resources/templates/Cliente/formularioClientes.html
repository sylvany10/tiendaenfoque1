<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Formulario Clientes</title>
</head>
<body>
<!--NAV-->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <!-- Logo como imagen a la izquierda -->
        <a class="navbar-brand" href="#">
            <img th:src="@{/imagenes/logoec.png}" alt="Enfoque" width="220" height="auto" class="d-inline-block align-text-top">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/formulario}">Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/clientes/formularioCliente}">Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/servicio/nuevo}">Servicios</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<h2>Registro de Clientes</h2>
<!--FORMULARIO DE CLIENTES-->
<form th:action="@{/clientes/guardarCliente}" th:object="${cliente}" method="post">
    <div class="mb-3">
        <label for="id-identificacionC" class="form-label">Identificación</label>
        <input type="text" id="id-identificacionC" class="form-control" th:field="*{identificacionC}">
    </div>
    <div class="mb-3">
        <label for="id-nombreCliente" class="form-label">Nombre</label>
        <input type="text" id="id-nombreCliente" class="form-control" th:field="*{nombreCliente}">
    </div>
    <div class="mb-3">
        <label for="id-apellidoCliente" class="form-label">Apellido</label>
        <input type="text" class="form-control" id="id-apellidoCliente" th:field="*{apellidoCliente}">
    </div>
    <div class="mb-3">
        <label for="id-direccionCliente" class="form-label">Dirección</label>
        <input type="text" id="id-direccionCliente" class="form-control" th:field="*{direccionCliente}">
    </div>
    <div class="mb-3">
        <label for="id-telefonoCliente" class="form-label">Teléfono</label>
        <input type="text" id="id-telefonoCliente" class="form-control" th:field="*{telefonoCliente}">
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
</form>
</body>
</html>
