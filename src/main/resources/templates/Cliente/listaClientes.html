<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Clientes</title>
</head>
<body>
<!--NAV-->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <!-- Logo como imagen a la izquierda -->
        <a class="navbar-brand" href="#">
            <img th:src="@{/imagenes/logoec.png}" alt="Enfoque" width="220" height="auto" class="d-inline-block align-text-top">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/formulario}">Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/clientes/formularioCliente}">Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/servicio/nuevo}">Servicios</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<!--LISTA CLIENTES-->
    <h2>Lista de Clientes</h2>
    <div class="container mt-4">
        <table>
            <thead>
               <tr>
                   <th>CodigoCliente</th>
                   <th>NombreCliente</th>
                   <th>ApellidoCliente</th>
                   <th>DireccionCliente</th>
                   <th>TelefonoCliente</th>
                   <th>Acciones</th>
               </tr>
            </thead>
                <tbody>
                    <tr th:each="cliente: ${clientes}">
                        <td th:text="${cliente.id}"></td>
                        <td th:text="${cliente.nombreCliente}"></td>
                        <td th:text="${cliente.apellidoCliente}"></td>
                        <td th:text="${cliente.direccionCliente}"></td>
                        <td th:text="${cliente.telefonoCliente}"></td>
                        <td>
                            <a th:href="@{/clientes/editarCliente/{id}(id=${cliente.id})}"class="btn btn-warning btn-sm">Actualizar</a>
                            <a th:href="@{/clientes/eliminarCliente/{id}(id=${cliente.id})}"class="btn btn-warning btn-sm">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
        </table>
        <a th:href="@{/clientes/formularioCliente}"class="btn btn-primary text-white btn-sm">Nuevo Cliente</a>
    </div>
</body>
</html>
